name: Promote pricing to main

# Push to tool/pricing → copy public/tools/pricing (+ this workflow folder) onto main.
# Vercel (Git integration on main) then deploys production automatically.
# No more manual cherry-picks to main for pricing-tool updates.

on:
  push:
    branches: [tool/pricing]
    paths:
      - "public/tools/pricing/**"
      - ".github/workflows/**"

concurrency:
  group: promote-pricing
  cancel-in-progress: false

jobs:
  promote:
    name: Sync pricing → main
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote pricing files to main
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

          git checkout origin/tool/pricing -- public/tools/pricing .github/workflows
          git add public/tools/pricing .github/workflows

          if git diff --cached --quiet; then
            echo "main already has the latest pricing tool + workflows"
            exit 0
          fi

          git commit -m "chore: sync pricing tool from tool/pricing"
          git push origin main
          echo "Promoted pricing changes to main — Vercel will deploy production."
