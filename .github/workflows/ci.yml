name: CI

on:
  push:
    branches: [main, tool/pricing]
  pull_request:
    branches: [main, tool/pricing]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Build must succeed without private keys in CI
          SKIP_ENV_VALIDATION: "1"
